name: Keep Alive & Reap Sandboxes
on:
  schedule:
    - cron: '0 * * * *'     # hourly — the guest sandbox TTL is 2 hours
  workflow_dispatch: {}     # lets you trigger it manually too

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf https://the-akashic-records.vercel.app/api/health

      # The reaper used to be a setInterval inside the Express app. Vercel freezes the
      # function between requests, so that timer never fired in production and stale
      # guest databases were never dropped. Driving it from here is what makes the
      # 2-hour TTL real.
      - name: Reap stale guest sandboxes
        env:
          SYSTEM_ADMIN_SECRET: ${{ secrets.SYSTEM_ADMIN_SECRET }}
        run: |
          if [ -z "$SYSTEM_ADMIN_SECRET" ]; then
            echo "SYSTEM_ADMIN_SECRET is not configured for this repository."
            echo "Add it under Settings > Secrets and variables > Actions to enable reaping."
            exit 0
          fi
          curl -sf -X POST \
            -H "x-system-secret: $SYSTEM_ADMIN_SECRET" \
            https://the-akashic-records.vercel.app/api/admin/reap-sandboxes
