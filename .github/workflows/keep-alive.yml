name: Keep MongoDB Alive
on:
  schedule:
    - cron: '0 3 */3 * *'   # every 3 days at 3am UTC
  workflow_dispatch: {}     # lets you trigger it manually too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf https://the-akashic-records.vercel.app/api/health
